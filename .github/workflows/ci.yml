name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            toolchain: stable
          - os: ubuntu-24.04
            toolchain: stable
          # Windows prebuilds are pinned to 1.89.0 (see prebuilds.yml).
          - os: windows-2025
            toolchain: 1.89.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      # fuse3 provides fusermount3 for DeltaFS mounts; acl provides setfacl
      # for the cbcow-private metadata publication test.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config fuse3 acl
      # The Linux sandbox's default read policy covers /usr and /usr/local but
      # not $HOME, so rustup's ~/.cargo/bin proxies cannot run inside it, and
      # sandboxed commands do not receive RUSTUP_HOME. Install the toolchain
      # as a standalone copy under /usr/local and put it first on PATH, so the
      # in-sandbox tool compatibility test finds a usable cargo.
      - name: Install standalone toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo cp -a "$(rustc --print sysroot)/." /usr/local/
          echo /usr/local/bin >> "$GITHUB_PATH"
      # WinFsp (driver and SDK headers) backs the Windows cbcow modes.
      - if: runner.os == 'Windows'
        run: choco install winfsp --yes --no-progress
      - name: Workspace tests
        if: runner.os != 'Windows'
        run: cargo test --workspace --no-fail-fast
      - if: runner.os == 'Windows'
        run: cargo test -p deltabox-core --lib
      - if: runner.os == 'Windows'
        run: cargo test -p deltabox --test network_approvals
      # Hosted Windows lacks usable MXC PSEC. Compile all suites and run the
      # ordinary copy-private tests; PSEC-dependent cases report as ignored.
      # Supported Windows hosts can opt in with --include-ignored.
      - name: Windows session tests (PSEC cases ignored)
        if: runner.os == 'Windows'
        run: >
          cargo test -p deltabox
          --test windows_mxc
          --test copy_private_windows
          --test cbcow_windows
          -- --test-threads=1
      - if: runner.os == 'Windows'
        run: cargo check -p deltabox-node
