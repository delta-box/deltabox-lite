name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            toolchain: stable
          - os: ubuntu-24.04
            toolchain: stable
          # Windows prebuilds are pinned to 1.89.0 (see prebuilds.yml).
          - os: windows-2025
            toolchain: 1.89.0
          # Hosted windows-11-arm has Microsoft MXC PSEC (Windows 11 24H2 at
          # build .9278 or later), so the PSEC-dependent tests run there.
          - os: windows-11-arm
            toolchain: 1.89.0
            ignored_tests: --include-ignored
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      # fuse3 provides fusermount3 for DeltaFS mounts; acl provides setfacl
      # for the cbcow-private metadata publication test.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config fuse3 acl
      # The Linux sandbox's default read policy covers /usr and /usr/local but
      # not $HOME, so rustup's ~/.cargo/bin proxies cannot run inside it, and
      # sandboxed commands do not receive RUSTUP_HOME. Install the toolchain
      # as a standalone copy under /usr/local and put it first on PATH, so the
      # in-sandbox tool compatibility test finds a usable cargo.
      - name: Install standalone toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo cp -a "$(rustc --print sysroot)/." /usr/local/
          echo /usr/local/bin >> "$GITHUB_PATH"
      # WinFsp (driver and SDK headers) backs the Windows cbcow modes. The
      # MSI covers both x64 and ARM64.
      - name: Install WinFsp
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi -OutFile winfsp.msi
          Start-Process msiexec.exe -Wait -ArgumentList '/i', 'winfsp.msi', '/qn', 'ADDLOCAL=ALL'
      - name: Workspace tests
        if: runner.os != 'Windows'
        run: cargo test --workspace --no-fail-fast
      - if: runner.os == 'Windows'
        run: cargo test -p deltabox-core --lib
      # Hosted windows-2025 lacks usable MXC PSEC, so there the PSEC-dependent
      # cases report as ignored; windows-11-arm runs them with
      # --include-ignored.
      - name: Windows session tests
        if: runner.os == 'Windows'
        run: >
          cargo test -p deltabox
          --test windows_mxc
          --test copy_private_windows
          --test cbcow_windows
          --test network_approvals
          -- --test-threads=1 ${{ matrix.ignored_tests }}
      - if: runner.os == 'Windows'
        run: cargo check -p deltabox-node
