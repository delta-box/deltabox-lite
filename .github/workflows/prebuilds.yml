name: prebuilds

# Build the four platform prebuilds and, for a version tag, publish them.
#
#   workflow_dispatch   build + verify only; artifacts on the run page
#   push tag v*         build + verify, then one restartable publish job:
#                       draft GitHub release from the tag message, upload the
#                       tarballs and npm packages, publish the platform
#                       packages and then the wrapper to npm (skipping
#                       versions that already exist), flip the release to
#                       published; finally update the Homebrew tap.
#
# scripts/release.mjs creates and pushes the tag. Nothing here publishes
# anything before every platform has built and passed its smoke tests.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config
      - run: node scripts/package-prebuild.mjs ${{ matrix.target }} dist
      - name: Verify packaged launcher
        # Mirror the documented install path (`npm install --global
        # deltabox-lite`) closely enough to catch the two ways it breaks: a
        # wrapper without a launcher, and a wrapper whose optionalDependencies
        # pin does not match the platform package it would pull from the
        # registry. The platform package is not on the registry during the
        # build, so it is unpacked into the nested node_modules layout a real
        # global install produces, and the pin is compared explicitly.
        run: |
          mkdir -p dist/smoke
          npm pack ./npm/deltabox-lite --pack-destination dist/smoke
          prefix=dist/smoke/install
          npm install --global --offline --ignore-scripts --no-audit --no-fund \
            --prefix "$prefix" ./dist/smoke/deltabox-lite-*.tgz
          wrapper="$prefix/lib/node_modules/deltabox-lite"
          platform_tgz=$(ls dist/deltabox-lite-*.tgz)
          platform_name=$(tar -xzOf "$platform_tgz" package/package.json \
            | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
          mkdir -p "$wrapper/node_modules/$platform_name"
          tar -xzf "$platform_tgz" --strip-components=1 -C "$wrapper/node_modules/$platform_name"
          WRAPPER="$wrapper" PLATFORM="$platform_name" node -e '
            const { resolve } = require("node:path");
            const wrapper = require(resolve(process.env.WRAPPER, "package.json"));
            const platform = require(resolve(process.env.WRAPPER, "node_modules", process.env.PLATFORM, "package.json"));
            const pin = wrapper.optionalDependencies[platform.name];
            if (pin !== platform.version) {
              console.error(`pin mismatch: wrapper pins ${platform.name}@${pin}, tarball is ${platform.version}`);
              process.exit(1);
            }
            if (platform.bin) {
              console.error(`platform package ${platform.name} must not declare a bin; the wrapper launcher owns the command`);
              process.exit(1);
            }
            console.log(`pin ok: ${platform.name}@${platform.version}`);
            console.log("binary:", require(resolve(process.env.WRAPPER)).binaryPath());
          '
          "$prefix/bin/deltabox" --version
      - name: Verify binary tarball
        run: |
          mkdir -p dist/tarball
          (cd dist && shasum -a 256 -c ./*.tar.gz.sha256)
          tar -xzf dist/deltabox-*.tar.gz -C dist/tarball
          dist/tarball/deltabox --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          # overwrite lets a re-run of one failed leg replace its own artifact
          # instead of failing on the name collision.
          overwrite: true
          path: |
            dist/*.tgz
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  publish:
    needs: binary
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check that the tag matches the workspace version
        run: |
          version="${TAG#v}"
          workspace=$(node -p 'require("fs").readFileSync("Cargo.toml","utf8").match(/\[workspace\.package\][\s\S]*?\nversion = "([^"]+)"/)[1]')
          if [ "$version" != "$workspace" ]; then
            echo "::error::tag $TAG does not match Cargo.toml workspace version $workspace"
            exit 1
          fi
          ls -1 dist
          test "$(ls dist/*.tar.gz | wc -l)" -eq 4 || { echo "::error::expected 4 platform tarballs"; exit 1; }
      - run: npm pack ./npm/deltabox-lite --pack-destination dist
      - name: Create the draft release and upload assets
        # The tag's annotation body is the changelog section for this version
        # (scripts/release.mjs writes it); actions/checkout fetches the commit,
        # not the tag object, so fetch the tag explicitly before reading it.
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git tag -l --format='%(contents:body)' "$TAG" > release-notes.md
            gh release create "$TAG" --draft --title "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.tgz --clobber
      - name: Publish to npm
        # Platform packages first, the wrapper last, so the wrapper's exact
        # pins resolve the moment it appears. Each publish is skipped when that
        # exact version already exists, so a re-run after a partial failure
        # finishes the job instead of dying on EPUBLISHCONFLICT.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish() {
            local tgz=$1 name version
            name=$(tar -xzOf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).name')
            version=$(tar -xzOf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping"
            else
              npm publish "$tgz" --access public
            fi
          }
          version="${TAG#v}"
          wrapper="dist/deltabox-lite-$version.tgz"
          for tgz in dist/deltabox-lite-*.tgz; do
            [ "$tgz" = "$wrapper" ] && continue
            publish "$tgz"
          done
          publish "$wrapper"
      - name: Publish the GitHub release
        run: gh release edit "$TAG" --draft=false

  # Rewrite the Homebrew formula with this release's tarball checksums and
  # push it to the tap repository. Runs after publish so the tap never points
  # at a release that did not fully ship. Skipped, loudly, until
  # HOMEBREW_TAP_TOKEN (a token with push access to the tap) is configured.
  homebrew:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      HOMEBREW_TAP_REPO: Ddnirvana/homebrew-tap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Render the formula from the release checksums
        run: |
          node scripts/update-homebrew-formula.mjs "${TAG#v}" --from-dir dist --out dist/deltabox.rb
          cat dist/deltabox.rb
      - name: Push to the tap
        # The token is used only as the push URL of one command; it is never
        # written into a git config.
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap was not updated for $TAG"
            exit 0
          fi
          git clone --depth 1 "https://github.com/${HOMEBREW_TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp dist/deltabox.rb tap/Formula/deltabox.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/deltabox.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
            exit 0
          fi
          git commit -m "deltabox $TAG"
          git push "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" HEAD:main
