[package]
name = "deltabox-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Node-API bindings for embedding deltabox-lite"

[lib]
crate-type = ["cdylib"]

[dependencies]
deltabox-core = { path = "../deltabox-core" }
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"

[build-dependencies]
napi-build = "=2.2.4"
