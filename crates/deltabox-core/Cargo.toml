[package]
name = "deltabox-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core library for deltabox-lite: agent-native sandbox sessions with diff/commit/abort"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
toml.workspace = true
similar.workspace = true
walkdir = "2"
base64 = "0.22"
libc.workspace = true
# `asm` selects the hardware SHA-256 implementation (ARMv8 crypto
# extensions / x86 SHA-NI): content digests power publog sibling
# endorsement and fingerprint scans, and the digest cap is sized to a
# fixed time budget, so digest coverage scales with this throughput.
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
xattr = "1"
deltafs-fuse.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security"] }
appcontainer_common = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
wxc_common = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }
learning_mode_windows = { git = "https://github.com/microsoft/mxc", rev = "6cd3d58f05d3447e67109cfb75e042803b843ca4" }

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "linux")'.dependencies]
sandlock-core = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
bincode = "1.3"
wait-timeout = "0.2"
