[package]
name = "deltafs-fuse"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ddnirvana/deltabox-lite"
rust-version = "1.85"
description = "Standalone commit-biased filesystem prototype for Deltabox"

[[bin]]
name = "deltafs-fuse"
path = "src/main.rs"

[features]
default = []
fuse = ["dep:fuser", "dep:xattr"]
macos-no-mount = ["fuse", "fuser/macos-no-mount"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fuser = { version = "0.18", optional = true }
xattr = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

# Keep the Phase 0 filesystem independently buildable. It will join the parent
# workspace only after the standalone feasibility gates pass.
[workspace]

