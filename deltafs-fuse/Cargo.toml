[package]
name = "deltafs-fuse"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ddnirvana/deltabox-lite"
rust-version = "1.85"
description = "Standalone commit-biased filesystem for Deltabox"

[[bin]]
name = "deltafs-fuse"
path = "src/main.rs"

[[bench]]
name = "empty_control"
harness = false

[features]
default = []
fuse = ["dep:fuser"]
macos-no-mount = ["fuse", "fuser/macos-no-mount"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crc32fast = "1"
fuser = { version = "0.18", optional = true }
xattr = "1"

[dev-dependencies]
tempfile = "3"
proptest = "1"
