[workspace]
resolver = "2"
members = [
  "crates/deltabox-core",
  "crates/deltabox-cli",
  "crates/deltabox-node",
  "deltafs-fuse",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/delta-box/deltabox-lite"
rust-version = "1.87"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
tempfile = "3"
similar = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
deltafs-fuse = { path = "deltafs-fuse" }
