[workspace]
resolver = "2"
members = ["crates/deltabox-core", "crates/deltabox-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/deltabox-lite/deltabox-lite"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
tempfile = "3"
similar = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

